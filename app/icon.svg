<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Shroomstead: a mushroom shaped like a little house" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Shroomstead</title>

  <!-- app-icon background -->
  <rect width="512" height="512" rx="112" fill="#FFF0D4"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="446" rx="128" ry="12" fill="#5B3A29" opacity="0.14"/>

  <!-- chimney (sits behind the cap) -->
  <rect x="326" y="58" width="42" height="80" rx="10" fill="#A9694A" stroke="#5B3A29" stroke-width="12" stroke-linejoin="round"/>
  <rect x="318" y="48" width="58" height="22" rx="8" fill="#C98562" stroke="#5B3A29" stroke-width="12" stroke-linejoin="round"/>

  <!-- stem = house walls -->
  <path d="M170 250 H342 V398 Q342 440 300 440 H212 Q170 440 170 398 Z"
        fill="#FDF1DC" stroke="#5B3A29" stroke-width="12" stroke-linejoin="round"/>

  <!-- door -->
  <path d="M226 440 V362 Q226 322 256 322 Q286 322 286 362 V440 Z"
        fill="#A9694A" stroke="#5B3A29" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="273" cy="386" r="6" fill="#FFE08A"/>

  <!-- round windows -->
  <circle cx="198" cy="344" r="16" fill="#FFE08A" stroke="#5B3A29" stroke-width="10"/>
  <circle cx="314" cy="344" r="16" fill="#FFE08A" stroke="#5B3A29" stroke-width="10"/>

  <!-- cap = roof -->
  <path d="M58 272 Q58 92 256 92 Q454 92 454 272 Q454 292 434 292 H78 Q58 292 58 272 Z"
        fill="#F2685B" stroke="#5B3A29" stroke-width="12" stroke-linejoin="round"/>

  <!-- cap spots -->
  <circle cx="148" cy="206" r="27" fill="#FFF8EC"/>
  <circle cx="256" cy="152" r="23" fill="#FFF8EC"/>
  <circle cx="364" cy="208" r="29" fill="#FFF8EC"/>
  <circle cx="226" cy="252" r="13" fill="#FFF8EC"/>
  <circle cx="300" cy="248" r="10" fill="#FFF8EC"/>
</svg>